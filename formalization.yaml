fidelity:
  divergences: >-
    Challenge replaces the specialized Valov assumption with its general Type-1-to-Type-0
    Polish-space version, which implies the required instance. The other four
    input definitions agree with the substantive development. This is a
    conditional implication, not an unconditional Lean proof of the manuscript.
