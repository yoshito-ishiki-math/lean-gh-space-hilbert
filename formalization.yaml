version: v0.4
project:
  name: "Conditional Hilbert-space classification of Gromov--Hausdorff space"
  description: >-
    A Lean formalization of the implication from five explicitly stated literature
    inputs to a homeomorphism between the ordinary Gromov--Hausdorff space of
    nonempty compact metric spaces and real square-summable sequences.
    The proof constructs invariant full-support probability assignments, finite
    dimensional local models, global AR domination and discrete approximation.
    The five literature inputs are assumptions, not theorems proved in this snapshot.
  authors: ["Yoshito Ishiki"]
  responsible_maintainers: ["Yoshito Ishiki"]
  license: MIT
classification:
  arxiv: [math.GN, math.MG]
  msc2020: [54E35, 54C55]
